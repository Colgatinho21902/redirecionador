<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="{{BACKGROUND}}">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Ver oferta | {{STORE}}</title>
  <meta name="description" content="Acesse o produto {{PREPOSITION}} {{STORE}}.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233483fa'/%3E%3Cpath d='M18 32h28M34 20l12 12-12 12' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    *{box-sizing:border-box}
    html{background:#f5f6f8}
    body{margin:0;min-height:100vh;min-height:100svh;font-family:Arial,Helvetica,sans-serif;color:#172b4d;display:grid;place-items:center;padding:24px 16px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));background:linear-gradient(to bottom,{{BACKGROUND}} 0,{{BACKGROUND}} 45%,#f5f6f8 45%,#f5f6f8 100%)}
    main{width:100%;max-width:390px;padding:40px 24px 28px;background:white;border:1px solid #e6e9ef;border-radius:24px;box-shadow:0 16px 50px #172b4d0d;text-align:center}
    .brand-logo{display:block;width:201px;max-width:100%;height:auto;margin:0 auto 36px}
    .brand-name{font-size:32px;font-weight:800;margin:0 0 32px;letter-spacing:-1px}
    h1{margin:0 0 12px;font-size:26px;line-height:1.2;letter-spacing:-.7px;font-weight:750}
    p{margin:0;color:#5a667b;font-size:15px;line-height:1.6}
    .button{display:flex;align-items:center;justify-content:center;gap:16px;width:100%;min-height:60px;margin-top:28px;padding:16px 20px;border-radius:12px;background:#3483fa;color:white;font-size:16px;line-height:1.3;font-weight:700;text-decoration:none;touch-action:manipulation}
    .button:hover{background:#2968c8}.button:active{background:#2158ad}
    .button:focus-visible{outline:3px solid #162b4c;outline-offset:4px}
    .button svg{flex:none;width:20px;height:20px}
    .note{margin-top:18px;font-size:12px;color:#687488;line-height:1.5}
    @media(max-width:359px){main{padding:32px 20px 24px}h1{font-size:24px}.brand-logo{width:188px;margin-bottom:28px}}
    @media(max-height:500px){main{padding-top:24px;padding-bottom:24px}.brand-logo{margin-bottom:20px}.button{margin-top:20px}}
  </style>
</head>
<body>
  <main>
    {{BRAND}}
    <h1>Sua próxima oferta<br>está aqui.</h1>
    <p>Toque no botão para ver o produto<br>{{PREPOSITION}} {{STORE}}.</p>
    <a class="button" href="{{URL}}" rel="sponsored noreferrer noopener" referrerpolicy="no-referrer">VER OFERTA<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <p class="note">Preço e disponibilidade são informados na loja.</p>
  </main>
</body>
</html>
